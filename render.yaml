services:
  - type: web
    name: datatech-labs-ai-project-advisor-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        value: sqlite:////app/storage/advisor.db
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: MAX_CONCURRENT_REQUESTS
        value: "2"
